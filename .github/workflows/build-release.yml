name: Build Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout mmts-edit-gui
        uses: actions/checkout@v6

      - name: Checkout dantto4k
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/dantto4k
          path: dantto4k
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-lgpl-shared.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip' `
            -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $root = Get-ChildItem -Path $env:RUNNER_TEMP -Directory | Where-Object { $_.Name -like 'ffmpeg-master-latest-win64-lgpl-shared*' } | Select-Object -First 1
          if (-not $root) {
            throw 'Expanded FFmpeg directory not found.'
          }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\thirdparty" | Out-Null
          Move-Item -LiteralPath $root.FullName -Destination "$env:GITHUB_WORKSPACE\thirdparty\ffmpeg"

      - name: Install TSDuck prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "dantto4k\thirdparty\tsduck\scripts\install-prerequisites.ps1" `
            -GitHubActions `
            -NoDoxygen `
            -NoInstaller `
            -NoPause

      - name: Patch TSDuck MSVC warning settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $propsPath = "dantto4k\thirdparty\tsduck\scripts\msvc\msvc-common-base.props"
          $props = Get-Content -LiteralPath $propsPath -Raw
          $patched = $props.Replace(
            "4800;4702;4592;4505;5264;`$(DisableSpecificWarnings)",
            "4800;4702;4592;4505;4819;5264;`$(DisableSpecificWarnings)")
          if ($patched -eq $props) {
            throw "Failed to patch TSDuck warning settings."
          }
          Set-Content -LiteralPath $propsPath -Value $patched -Encoding utf8

      - name: Build TSDuck static libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TS_NO_VATEK = '1'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found."
          }
          & $msbuild "dantto4k\thirdparty\tsduck\scripts\msvc\tsduck.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/target:tscorelib;tsducklib"
          if ($LASTEXITCODE -ne 0) {
            throw "TSDuck static library build failed."
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-msvc -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DDANTTO4K_DIR="$env:GITHUB_WORKSPACE\dantto4k" `
            -DFFMPEG_DIR="$env:GITHUB_WORKSPACE\thirdparty\ffmpeg" `
            -DMMTS_ENABLE_TSDUCK=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-msvc --config Release --target mmts-edit-gui

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $package = "mmts-edit-gui-$version-win64"
          $stage = Join-Path $env:RUNNER_TEMP $package
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "build-msvc\Release\mmts-edit-gui.exe" $stage
          Copy-Item "build-msvc\Release\avcodec-62.dll" $stage -ErrorAction SilentlyContinue
          Copy-Item "build-msvc\Release\avutil-60.dll" $stage -ErrorAction SilentlyContinue
          Copy-Item "build-msvc\Release\swscale-9.dll" $stage -ErrorAction SilentlyContinue
          Copy-Item "build-msvc\Release\swresample-6.dll" $stage -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE $stage

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --compiler-runtime "$stage\mmts-edit-gui.exe"

          Compress-Archive -Path "$stage\*" -DestinationPath "$package.zip" -Force
          "PACKAGE=$package.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ${{ env.PACKAGE }}
          retention-days: 7

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}

  linux-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mmts-edit-gui
        uses: actions/checkout@v6

      - name: Checkout dantto4k
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/dantto4k
          path: dantto4k

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libfuse2 \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev-tools

      - name: Prepare FFmpeg layout
        run: |
          set -eux
          FFMPEG_DIR="$RUNNER_TEMP/ffmpeg-linux"
          mkdir -p "$FFMPEG_DIR/bin"
          ln -s /usr/include/x86_64-linux-gnu "$FFMPEG_DIR/include"
          ln -s /usr/lib/x86_64-linux-gnu "$FFMPEG_DIR/lib"
          for lib in libavcodec.so.59 libavutil.so.57 libswscale.so.6 libswresample.so.4; do
            if [ -e "/usr/lib/x86_64-linux-gnu/$lib" ]; then
              ln -s "/usr/lib/x86_64-linux-gnu/$lib" "$FFMPEG_DIR/bin/$lib"
            fi
          done
          echo "FFMPEG_DIR=$FFMPEG_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DDANTTO4K_DIR="$GITHUB_WORKSPACE/dantto4k" \
            -DFFMPEG_DIR="$FFMPEG_DIR" \
            -DMMTS_ENABLE_TSDUCK=OFF

      - name: Build
        run: cmake --build build-linux --parallel --target mmts-edit-gui

      - name: Download linuxdeploy
        run: |
          set -eux
          curl -L -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -eux
          VERSION="${VERSION_TAG}"
          if [ "${#VERSION}" -gt 20 ]; then
            VERSION="${VERSION:0:7}"
          fi

          cat > mmts-edit-gui.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MMTS Edit GUI
          Exec=mmts-edit-gui %f
          Icon=mmts-edit-gui
          Categories=AudioVideo;Video;Qt;
          EOF

          cat > mmts-edit-gui.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="40" fill="#0f172a"/>
            <rect x="36" y="52" width="184" height="152" rx="20" fill="#1d4ed8"/>
            <path d="M64 162 L64 94 L94 128 Z" fill="#f8fafc"/>
            <rect x="110" y="112" width="24" height="32" rx="6" fill="#f8fafc"/>
            <rect x="146" y="96" width="24" height="48" rx="6" fill="#bfdbfe"/>
            <rect x="182" y="80" width="24" height="64" rx="6" fill="#93c5fd"/>
          </svg>
          EOF

          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/mmts-edit-gui
          cp build-linux/mmts-edit-gui AppDir/usr/bin/
          cp README.md LICENSE AppDir/usr/share/doc/mmts-edit-gui/

          export QMAKE=/usr/bin/qmake6
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e AppDir/usr/bin/mmts-edit-gui \
            -d mmts-edit-gui.desktop \
            -i mmts-edit-gui.svg \
            --plugin qt \
            --output appimage

          PACKAGE="mmts-edit-gui-$VERSION-linux-x86_64.AppImage"
          mv ./MMTS_Edit_GUI-x86_64.AppImage "./$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ env.PACKAGE }}
          retention-days: 7

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}
